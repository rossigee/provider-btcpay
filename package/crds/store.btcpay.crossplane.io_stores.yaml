---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: stores.store.btcpay.crossplane.io
spec:
  group: store.btcpay.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - btcpay
    kind: Store
    listKind: StoreList
    plural: stores
    singular: store
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.name
      name: STORE-NAME
      type: string
    - jsonPath: .status.atProvider.id
      name: STORE-ID
      type: string
    - jsonPath: .spec.forProvider.defaultCurrency
      name: CURRENCY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Store is a managed resource that represents a BTCPay Server
          store.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A StoreSpec defines the desired state of a Store.
            properties:
              forProvider:
                description: StoreParameters are the configurable fields of a Store.
                properties:
                  branding:
                    description: Branding configures store branding.
                    properties:
                      css:
                        description: CSS is custom CSS for the store.
                        type: string
                      htmlTitle:
                        description: HtmlTitle is the HTML title for store pages.
                        type: string
                      logoUrl:
                        description: LogoURL is the URL of the store logo.
                        type: string
                    type: object
                  checkoutType:
                    description: CheckoutType determines the checkout experience.
                    enum:
                    - V1
                    - V2
                    type: string
                  defaultCurrency:
                    description: DefaultCurrency is the default currency for the store.
                    enum:
                    - USD
                    - EUR
                    - BTC
                    - GBP
                    - JPY
                    - CAD
                    - AUD
                    - CHF
                    - CNY
                    - SEK
                    - NZD
                    - MXN
                    - SGD
                    - HKD
                    - NOK
                    - TRY
                    - RUB
                    - ZAR
                    - BRL
                    - MYR
                    - BGN
                    - CZK
                    - DKK
                    - HRK
                    - HUF
                    - ISK
                    - PLN
                    - RON
                    - THB
                    - ILS
                    - CLP
                    - PHP
                    - AED
                    - COP
                    - EGP
                    - HUF
                    - IDR
                    - INR
                    - KRW
                    - KWD
                    - LKR
                    - MAD
                    - NPR
                    - PKR
                    - QAR
                    - SAR
                    - UAH
                    - UYU
                    - VND
                    - ZMW
                    type: string
                  defaultLang:
                    description: DefaultLang is the default language for the store.
                    type: string
                  invoiceExpiration:
                    description: |-
                      InvoiceExpiration is the default invoice expiration time in seconds.
                      Default is 900 seconds (15 minutes).
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  lightningAmountInSatoshi:
                    description: LightningAmountInSatoshi enables Lightning amounts
                      to be displayed in Satoshi.
                    type: boolean
                  lightningPrivateRouteHints:
                    description: LightningPrivateRouteHints enables private route
                      hints for Lightning invoices.
                    type: boolean
                  monitoringExpiration:
                    description: MonitoringExpiration is the time in seconds after
                      which invoices expire for monitoring.
                    format: int32
                    maximum: 86400
                    minimum: 600
                    type: integer
                  name:
                    description: Name is the display name of the store in BTCPay Server.
                    maxLength: 255
                    minLength: 1
                    type: string
                  networkFeeMode:
                    description: NetworkFeeMode determines how network fees are handled.
                    enum:
                    - Never
                    - Always
                    - MultiplePaymentsOnly
                    type: string
                  onChainWithLnInvoiceFallback:
                    description: OnChainWithLnInvoiceFallback enables on-chain fallback
                      for Lightning invoices.
                    type: boolean
                  paymentTolerance:
                    description: |-
                      PaymentTolerance is the payment tolerance percentage for underpayments.
                      Default is 0.0 (no tolerance).
                    maximum: 100
                    minimum: 0
                    type: number
                  receipt:
                    description: Receipt configures receipt settings.
                    properties:
                      enabled:
                        description: Enabled determines if receipts are generated.
                        type: boolean
                      showPayments:
                        description: ShowPayments shows payment details on receipts.
                        type: boolean
                      showQR:
                        description: ShowQR shows QR code on receipts.
                        type: boolean
                    type: object
                  recommendedFeeBlockTarget:
                    description: RecommendedFeeBlockTarget is the block target for
                      recommended fee calculation.
                    format: int32
                    maximum: 1008
                    minimum: 1
                    type: integer
                  redirectAutomatically:
                    description: RedirectAutomatically enables automatic redirect
                      after payment.
                    type: boolean
                  showRecommendedFee:
                    description: ShowRecommendedFee shows recommended fee on checkout.
                    type: boolean
                  speedPolicy:
                    description: SpeedPolicy determines the confirmation speed policy.
                    enum:
                    - High
                    - Medium
                    - Low
                    type: string
                  website:
                    description: Website is the website URL associated with the store.
                    maxLength: 2048
                    pattern: ^https://
                    type: string
                required:
                - defaultCurrency
                - name
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A StoreStatus represents the observed state of a Store.
            properties:
              atProvider:
                description: StoreObservation are the observable fields of a Store.
                properties:
                  createdAt:
                    description: CreatedAt is the timestamp when the store was created.
                    format: date-time
                    type: string
                  defaultCurrency:
                    description: DefaultCurrency is the default currency for the store.
                    type: string
                  derivationSchemes:
                    additionalProperties:
                      type: string
                    description: DerivationSchemes are the configured derivation schemes.
                    type: object
                  id:
                    description: ID is the unique identifier of the store in BTCPay
                      Server.
                    type: string
                  invoiceExpiration:
                    description: InvoiceExpiration is the current invoice expiration
                      time.
                    format: int32
                    type: integer
                  name:
                    description: Name is the current name of the store.
                    type: string
                  paymentMethods:
                    description: PaymentMethods are the enabled payment methods for
                      the store.
                    items:
                      type: string
                    type: array
                  website:
                    description: Website is the website URL associated with the store.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
