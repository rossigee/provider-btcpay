                        type: string
                      label:
                        description: Label is a human-readable label for the payment
                          method.
                        type: string
                    required:
                    - derivationScheme
                    type: object
                  paymentType:
                    description: PaymentType determines if this is onchain or lightning.
                    enum:
                    - onchain
                    - lightning
                    type: string
                  storeRef:
