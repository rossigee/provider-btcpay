              forProvider:
                description: PaymentMethodParameters are the configurable fields of
                  a PaymentMethod.
                properties:
                  cryptoCode:
                    description: CryptoCode is the cryptocurrency code (BTC, LTC,
                      etc.).
                    enum:
                    - BTC
                    - LTC
                    - BCH
                    - BTG
                    - DASH
                    - DOGE
                    - GRS
                    - MONA
                    - ETH
                    - BNB
                    - USDT
                    - USDC
                    - DAI
                    type: string
                  enabled:
                    description: Enabled determines if the payment method is active.
                    type: boolean
                  lightning:
                    description: Lightning configuration for Lightning Network payment
                      methods.
                    properties:
                      connectionString:
                        description: ConnectionString is the Lightning Network connection
