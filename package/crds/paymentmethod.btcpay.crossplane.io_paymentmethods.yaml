              PaymentMethod.
            properties:
              atProvider:
                description: PaymentMethodObservation are the observable fields of
                  a PaymentMethod.
                properties:
                  connectionInfo:
                    description: ConnectionInfo contains Lightning Network connection
                      details.
                    type: string
                  createdAt:
                    description: CreatedAt is the payment method creation timestamp.
                    format: date-time
                    type: string
                  cryptoCode:
                    description: CryptoCode is the cryptocurrency code.
                    type: string
                  derivationScheme:
                    description: DerivationScheme is the current derivation scheme
                      (for on-chain).
                    type: string
                  enabled:
                    description: Enabled indicates if the payment method is currently
                      active.
                    type: boolean
                  errorMessage:
                    description: ErrorMessage contains any error from the last sync.
                    type: string
                  lastSyncAt:
                    description: LastSyncAt is the timestamp of the last synchronization.
                    format: date-time
                    type: string
                  paymentMethodId:
                    description: PaymentMethodID is the unique identifier of the payment
                      method.
                    type: string
                  paymentType:
                    description: PaymentType indicates if this is onchain or lightning.
                    type: string
                  storeId:
                    description: StoreID is the store identifier this payment method
                      belongs to.
                    type: string
                  syncStatus:
                    description: SyncStatus indicates the synchronization status.
                    type: string
                  walletBalance:
                    description: WalletBalance is the current wallet balance (for
                      on-chain).
                    type: string
