apiVersion: meta.pkg.crossplane.io/v1alpha1
kind: Provider
metadata:
  name: provider-btcpay
  annotations:
    meta.crossplane.io/maintainer: Crossplane Maintainers <info@crossplane.io>
    meta.crossplane.io/source: github.com/crossplane-contrib/provider-btcpay
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A Crossplane provider for managing BTCPay Server resources.
    meta.crossplane.io/readme: |
      `provider-btcpay` is the Crossplane infrastructure provider for
      [BTCPay Server](https://btcpayserver.org/).

      Available resources include:
      * Stores
      * Invoices
      * Users
      * Webhooks

spec:
  crossplane:
    version: ">=v1.14.0"