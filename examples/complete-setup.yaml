# Complete BTCPay Server Provider Example
# This demonstrates all available resources working together

---
# 1. ProviderConfig - Authentication configuration
apiVersion: pkg.crossplane.io/v1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: btcpay-creds
      key: credentials
---
# 2. Store - The central resource for BTCPay Server
apiVersion: store.btcpay.crossplane.io/v1alpha1
kind: Store
metadata:
  name: sample-btcpay-store
spec:
  forProvider:
    storeName: "Sample E-commerce Store"
    defaultCurrency: "USD"
    invoiceExpiration: 900  # 15 minutes
    speedPolicy: "MediumSpeed"
    paymentTolerance: 2.0
    showRecommendedFee: true
    derivationScheme: "xpub6CUGRUonZSQ4TWtTMmzXdrXDtypWKiKrhko4egpiMZbpiaQL2jkwSB1icqYh2cfDfVxdx4df189oLKnC5fSwqPfgyP3hooxujYzAu3fDVmz"
    branding:
      logoUrl: "https://example.com/logo.png"
      cssUrl: "https://example.com/custom.css"
      brandColor: "#ff6600"
    checkout:
      speedPolicy: "MediumSpeed"
      paymentTolerance: 2.0
      defaultLanguage: "en-US"
      htmlTitle: "Complete your payment"
      soundUrl: "https://example.com/payment-success.mp3"
      redirectAutomatically: true
      showStoreHeader: true
      celebratePayment: true
    receipt:
      enabled: true
      showQR: true
      showPayments: true
  providerConfigRef:
    name: default
  deletionPolicy: Delete
---
# 3. User - Store administrator
apiVersion: user.btcpay.crossplane.io/v1alpha1
kind: User
metadata:
  name: store-admin
spec:
  forProvider:
    email: "admin@example.com"
    password: "SecurePassword123!"
    name: "Store Administrator"
    isAdministrator: false
    roles:
      - "ServerAdmin"
      - "StoreOwner"
    disabled: false
    requireEmailConfirmation: false
  providerConfigRef:
    name: default
  deletionPolicy: Delete
---
# 4. Payment Methods - Bitcoin support
apiVersion: paymentmethod.btcpay.crossplane.io/v1alpha1
kind: PaymentMethod
metadata:
  name: btc-onchain-payment
spec:
  forProvider:
    storeRef:
      name: sample-btcpay-store
    cryptoCode: "BTC"
    paymentType: "onchain"
    enabled: true
    onChain:
      derivationScheme: "xpub6CUGRUonZSQ4TWtTMmzXdrXDtypWKiKrhko4egpiMZbpiaQL2jkwSB1icqYh2cfDfVxdx4df189oLKnC5fSwqPfgyP3hooxujYzAu3fDVmz"
      label: "Main Bitcoin Wallet"
  providerConfigRef:
    name: default
  deletionPolicy: Delete
---
apiVersion: paymentmethod.btcpay.crossplane.io/v1alpha1
kind: PaymentMethod
metadata:
  name: btc-lightning-payment
spec:
  forProvider:
    storeRef:
      name: sample-btcpay-store
    cryptoCode: "BTC"
    paymentType: "lightning"
    enabled: true
    lightning:
      connectionString: "type=lnd-rest;server=https://mylnd:8080/;macaroonfilepath=/home/user/.lnd/data/chain/bitcoin/mainnet/admin.macaroon;certfilepath=/home/user/.lnd/tls.cert"
  providerConfigRef:
    name: default
  deletionPolicy: Delete
---
# 5. Webhook - Payment notifications
apiVersion: webhook.btcpay.crossplane.io/v1alpha1
kind: Webhook
metadata:
  name: payment-webhook
spec:
  forProvider:
    storeRef:
      name: sample-btcpay-store
    url: "https://myapp.example.com/webhooks/btcpay"
    enabled: true
    automaticRedelivery: true
    secret: "webhook-secret-key"
    authorizedEvents:
      - "InvoiceCreated"
      - "InvoicePaymentSettled"
      - "InvoiceExpired"
      - "InvoiceInvalid"
  providerConfigRef:
    name: default
  deletionPolicy: Delete
---
# 6. Invoice - Example payment request
apiVersion: invoice.btcpay.crossplane.io/v1alpha1
kind: Invoice
metadata:
  name: sample-invoice
spec:
  forProvider:
    storeRef:
      name: sample-btcpay-store
    amount: 99.99
    currency: "USD"
    orderID: "ORDER-12345"
    itemDesc: "Premium Service Subscription"
    itemCode: "PREMIUM-001"
    buyerEmail: "customer@example.com"
    notificationURL: "https://myapp.example.com/notifications/btcpay"
    redirectURL: "https://myapp.example.com/payment/success"
    notificationEmail: "orders@example.com"
    physical: false
    taxIncluded: true
    extendedNotifications: true
    fullNotifications: false
    metadata:
      customerID: "CUST-789"
      planType: "premium"
      subscriptionPeriod: "monthly"
    checkoutQueryString: "theme=dark&lang=en"
  providerConfigRef:
    name: default
  deletionPolicy: Delete